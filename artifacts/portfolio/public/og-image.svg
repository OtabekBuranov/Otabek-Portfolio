<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b4eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(0,0,0,0.07)" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f4f5f9" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#textGrad)" />

  <!-- OB. monogram -->
  <text x="96" y="310"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="220"
    font-weight="800"
    letter-spacing="-8"
    fill="url(#textGrad)">OB.</text>

  <!-- Divider line -->
  <rect x="96" y="340" width="560" height="2" fill="#e2e4ec" />

  <!-- Name -->
  <text x="96" y="402"
    font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="#0f1123"
    letter-spacing="-1">Otabek Buranov</text>

  <!-- Title -->
  <text x="96" y="452"
    font-family="'Inter', Arial, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#6b7280">Digital Marketing Specialist &amp; Data Analyst</text>

  <!-- Location badge -->
  <rect x="96" y="490" width="290" height="42" rx="4" fill="white" stroke="#dde1ed" stroke-width="1.5" />
  <text x="118" y="516"
    font-family="'Inter', Arial, sans-serif"
    font-size="20"
    font-weight="500"
    fill="#6b7280">📍 SF Bay Area</text>

  <!-- Stats row -->
  <text x="96" y="576"
    font-family="'Inter', Arial, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#9ca3af">50K+ Accounts Reached  ·  4 Yrs Experience  ·  GPA 3.5  ·  CSUF '26</text>
</svg>
